provider:
  # Script-writing models, tried in order (gemini-2.5-flash is no longer offered to new API keys).
  # Override with the GEMINI_MODEL repository variable.
  models: ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-3.1-flash-lite"]

episode:
  minimum_seconds: 600
  maximum_seconds: 900
  minimum_utterances: 44
  maximum_utterances: 68
  temperature: 0.35
  max_output_tokens: 16384
  stories: 3
  generation_attempts: 3
  learner_level: "CEFR B1"

learning:
  vocabulary_min: 5
  vocabulary_max: 10
  quiz_min: 3
  quiz_max: 5
  max_slow_utterances: 10
  slow_rate: "-25%"
  shadowing_pause_ms: [1200, 2000]

weekly_review:
  # Built on Sundays (Japan time) by daily-multilang.yml, or on demand with its weekly_review input.
  lookback_days: 7
  max_expressions: 30

hosts:
  MC_F: "ミナ"
  MC_M: "レン"

tts:
  # gemini: one multilingual Gemini voice per host (needs GEMINI_API_KEY). edge: Microsoft Edge voices.
  provider: gemini
  # If Gemini TTS fails for an episode, render that whole episode with Edge TTS instead of skipping it.
  fallback: edge
  gemini:
    # Tried in order until one is accepted; override with the GEMINI_TTS_MODEL repository variable.
    models: ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]
    voices:
      MC_F: "Aoede"
      MC_M: "Puck"
    normal_direction: "Speak in {language} as a warm, relaxed radio host chatting naturally with a co-host"
    slow_direction: "Speak in {language} slowly and very clearly, with a small pause between words, so a learner can repeat after you"
    max_attempts: 6
    min_interval_seconds: 0

qa:
  max_silence_seconds: 3.0
  whisper_model: "base"
  minimum_transcript_ratio: 0.30

news:
  request_timeout_seconds: 25
  items_per_source: 8
  max_candidates: 32
  sources:
    - name: "NHK"
      url: "https://news.web.nhk/n-data/conf/na/rss/cat0.xml"
    - name: "BBC World"
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    - name: "Reuters via Google News"
      url: "https://news.google.com/rss/search?q=when%3A1d%20source%3AReuters&hl=en-US&gl=US&ceid=US%3Aen"

languages:
  - code: "de-DE"
    slug: "de"
    name: "German"
    japanese_name: "ドイツ語"
    voice_f: "de-DE-KatjaNeural"
    voice_m: "de-DE-ConradNeural"
  - code: "es-ES"
    slug: "es"
    name: "Spanish"
    japanese_name: "スペイン語"
    voice_f: "es-ES-ElviraNeural"
    voice_m: "es-ES-AlvaroNeural"
  - code: "ru-RU"
    slug: "ru"
    name: "Russian"
    japanese_name: "ロシア語"
    voice_f: "ru-RU-SvetlanaNeural"
    voice_m: "ru-RU-DmitryNeural"
  - code: "zh-CN"
    slug: "zh"
    name: "Chinese"
    japanese_name: "中国語"
    voice_f: "zh-CN-XiaoxiaoNeural"
    voice_m: "zh-CN-YunxiNeural"
  - code: "ko-KR"
    slug: "ko"
    name: "Korean"
    japanese_name: "韓国語"
    voice_f: "ko-KR-SunHiNeural"
    voice_m: "ko-KR-InJoonNeural"

japanese_voices:
  MC_F: "ja-JP-NanamiNeural"
  MC_M: "ja-JP-KeitaNeural"
