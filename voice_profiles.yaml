version: 2

program:
  name: "Journey Talk"
  target_min_seconds: 600
  target_max_seconds: 900
  loudness_lufs: -16.0
  true_peak_db: -1.5
  mp3_bitrate: "192k"

hosts:
  MC_F:
    name: "Mina"
    persona: "warm, curious, conversational; asks concrete follow-up questions"
    rate_delta_percent: 1
  MC_M:
    name: "Ren"
    persona: "calm, lightly witty, conversational; explains without sounding like a lecturer"
    rate_delta_percent: 0

intents:
  intro:
    pause_ms: 620
  story_intro:
    pause_ms: 760
  conversation:
    pause_ms: 390
  question:
    pause_ms: 330
  reaction:
    pause_ms: 260
  explanation:
    pause_ms: 520
  teaching:
    pause_ms: 650
  example:
    pause_ms: 460
  review:
    pause_ms: 560
  review_slow:
    pause_ms: 720
  trivia:
    pause_ms: 600
  closing:
    pause_ms: 820

qa:
  max_silence_seconds: 3.2
  min_mean_volume_db: -26.0
  max_mean_volume_db: -11.0
  max_peak_volume_db: -0.4
  whisper_model: "base"
  asr_samples_per_episode: 6
  asr_min_average_similarity: 0.32
  asr_min_single_similarity: 0.12
  min_segment_seconds: 0.28
  max_segment_seconds: 48.0
  max_failed_tts_attempts: 3

languages:
  ja-JP:
    slug: "ja"
    register: "casual-polite Japanese navigation; concise and never teacher-like"
    voice_f: "ja-JP-NanamiNeural"
    voice_m: "ja-JP-KeitaNeural"
    base_rate_percent: -4
    pitch_hz: 0
    volume_percent: 0
    chars_per_second: 4.3
    pause_multiplier: 1.0
    language_switch_bonus_ms: 180
    speaker_switch_bonus_ms: 70

  de-DE:
    slug: "de"
    register: "friendly du-register; concise, direct, natural German radio conversation"
    voice_f: "de-DE-KatjaNeural"
    voice_m: "de-DE-ConradNeural"
    base_rate_percent: -4
    pitch_hz: 0
    volume_percent: 0
    words_per_second: 2.35
    pause_multiplier: 1.05
    language_switch_bonus_ms: 180
    speaker_switch_bonus_ms: 80
    intent_rate_delta:
      reaction: 2
      question: 1
      teaching: -3
      review_slow: -7
    conversation_notes:
      - "Prefer short clear turns rather than long explanatory monologues."
      - "Use natural confirmations such as Genau, Stimmt, Ach so sparingly."
      - "Do not end every sentence with rising question-like intonation."

  es-ES:
    slug: "es"
    register: "friendly Spain Spanish with tú; energetic but not exaggerated"
    voice_f: "es-ES-ElviraNeural"
    voice_m: "es-ES-AlvaroNeural"
    base_rate_percent: 1
    pitch_hz: 0
    volume_percent: 0
    words_per_second: 2.55
    pause_multiplier: 0.88
    language_switch_bonus_ms: 150
    speaker_switch_bonus_ms: 45
    intent_rate_delta:
      reaction: 2
      question: 1
      teaching: -4
      review_slow: -8
    conversation_notes:
      - "Keep turn-taking lively with brief reactions such as Claro, Vale, Ya veo."
      - "Avoid slowing ordinary conversation so much that Spanish loses its rhythm."
      - "Keep fillers purposeful; never stack several in one turn."

  ru-RU:
    slug: "ru"
    register: "friendly co-host ты-register; calm modern spoken Russian"
    voice_f: "ru-RU-SvetlanaNeural"
    voice_m: "ru-RU-DmitryNeural"
    base_rate_percent: -5
    pitch_hz: 0
    volume_percent: 0
    words_per_second: 2.20
    pause_multiplier: 1.08
    language_switch_bonus_ms: 190
    speaker_switch_bonus_ms: 75
    intent_rate_delta:
      reaction: 1
      question: 0
      teaching: -3
      review_slow: -7
    conversation_notes:
      - "Use short backchannels such as Да, Понятно, Точно only when they add meaning."
      - "Avoid making every turn heavy or overly formal."
      - "Keep stress-sensitive proper nouns isolated in short clauses when possible."

  zh-CN:
    slug: "zh"
    register: "neutral friendly Putonghua; short clauses and clear conversational rhythm"
    voice_f: "zh-CN-XiaoxiaoNeural"
    voice_m: "zh-CN-YunxiNeural"
    base_rate_percent: -7
    pitch_hz: 0
    pitch_adjustment_allowed: false
    volume_percent: 0
    chars_per_second: 4.0
    pause_multiplier: 0.96
    language_switch_bonus_ms: 180
    speaker_switch_bonus_ms: 55
    intent_rate_delta:
      reaction: 2
      question: 0
      teaching: -4
      review_slow: -8
    conversation_notes:
      - "Prefer short clauses; do not overload one turn with nested explanations."
      - "Use natural reactions such as 对, 是啊, 原来如此 sparingly."
      - "Never alter pitch post-synthesis; tonal distinctions must remain untouched."

  ko-KR:
    slug: "ko"
    register: "friendly 해요체 between co-hosts; consistent polite-casual Korean"
    voice_f: "ko-KR-SunHiNeural"
    voice_m: "ko-KR-InJoonNeural"
    base_rate_percent: -5
    pitch_hz: 0
    volume_percent: 0
    chars_per_second: 3.8
    pause_multiplier: 0.98
    language_switch_bonus_ms: 180
    speaker_switch_bonus_ms: 55
    intent_rate_delta:
      reaction: 2
      question: 0
      teaching: -4
      review_slow: -8
    conversation_notes:
      - "Keep 해요체 consistent; avoid switching into 반말 without an explicit quoted example."
      - "Use reactions such as 맞아요, 그러게요, 그렇군요 naturally and sparingly."
      - "Prefer short-medium turns so liaison and endings stay easy to hear."
