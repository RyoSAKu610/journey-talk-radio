name: Journey Talk Production CI

on:
  pull_request:
    branches: [main]
    paths:
      - "voice_profiles.yaml"
      - "scripts/voice_director.py"
      - "scripts/prepare_episode_bundle.py"
      - "scripts/voice_healthcheck.py"
      - "scripts/render_language_episodes.py"
      - "scripts/qa_language_episodes.py"
      - "scripts/publish_multilang_site.py"
      - "tests/test_voice_director_v2.py"
      - ".github/workflows/daily-multilang.yml"
      - ".github/workflows/production-ci.yml"
  push:
    branches:
      - "prod/**"
    paths:
      - "voice_profiles.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install PyYAML==6.0.2 pydub==0.25.1 edge-tts==7.2.3 faster-whisper==1.2.0
      - name: Compile production code
        run: |
          python -m py_compile \
            scripts/voice_director.py \
            scripts/prepare_episode_bundle.py \
            scripts/voice_healthcheck.py \
            scripts/render_language_episodes.py \
            scripts/qa_language_episodes.py \
            scripts/publish_multilang_site.py
      - name: Run Voice Director unit tests
        run: python -m unittest tests.test_voice_director_v2 -v
      - name: Validate profile structure
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open('voice_profiles.yaml', encoding='utf-8'))
          assert cfg['version'] == 2
          assert set(cfg['languages']) == {'ja-JP','de-DE','es-ES','ru-RU','zh-CN','ko-KR'}
          assert cfg['languages']['zh-CN']['pitch_adjustment_allowed'] is False
          assert cfg['program']['target_min_seconds'] == 600
          assert cfg['program']['target_max_seconds'] == 900
          print('profile structure: PASS')
          PY
      - name: Reject accidental Gemini dependency in production workflow
        run: |
          if grep -qi "GEMINI_API_KEY\|generativelanguage.googleapis.com" .github/workflows/daily-multilang.yml; then
            echo "Production workflow must not depend on Gemini/API billing." >&2
            exit 1
          fi
          echo "no paid-API production dependency: PASS"
