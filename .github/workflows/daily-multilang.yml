name: Journey Talk Cloud Daily

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-multilang.yml"
      - "cloud_languages.yaml"
      - "scripts/build_language_episodes.py"
      - "scripts/render_language_episodes.py"
      - "scripts/qa_language_episodes.py"
      - "scripts/publish_multilang_site.py"
      - "docs/index.html"
      - "requirements.txt"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: journey-talk-cloud-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: \${{ vars.GEMINI_MODEL }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audio and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --requirement requirements.txt

      - name: Verify cloud contract
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY repository secret is required"; exit 1; }
          python -m py_compile scripts/build_language_episodes.py scripts/render_language_episodes.py scripts/qa_language_episodes.py scripts/publish_multilang_site.py
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("cloud_languages.yaml", encoding="utf-8"))
          assert [x["slug"] for x in cfg["languages"]] == ["de", "es", "ru", "zh", "ko"]
          assert cfg["episode"]["minimum_seconds"] == 600
          assert cfg["episode"]["maximum_seconds"] == 900
          print("cloud contract: PASS")
          PY

      - name: Resolve Japan date
        id: day
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate five language editions
        run: |
          DATE="\${{ steps.day.outputs.date }}"
          python scripts/build_language_episodes.py --date "$DATE"

      - name: Render five MP3 files
        run: |
          DATE="\${{ steps.day.outputs.date }}"
          python scripts/render_language_episodes.py \
            --episode-dir "output/languages/$DATE" \
            --output-dir "build/languages/$DATE"

      - name: Full-file audio QA and Whisper verification
        run: |
          DATE="\${{ steps.day.outputs.date }}"
          python scripts/qa_language_episodes.py \
            --episode-dir "output/languages/$DATE" \
            --media-dir "build/languages/$DATE" \
            --output-dir "build/qa/$DATE"

      - name: Publish date-stamped cloud archive
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          DATE="\${{ steps.day.outputs.date }}"
          TAG="multilang-\${DATE}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Journey Talk — \${DATE}" \
            --notes "Five verified 10–15 minute language-learning MP3 editions generated from current RSS news."
          gh release upload "$TAG" build/languages/"$DATE"/*.mp3 --clobber
          gh release upload "$TAG" output/languages/"$DATE"/*.json output/languages/"$DATE"/*.md --clobber
          gh release upload "$TAG" build/qa/"$DATE"/* --clobber

      - name: Update feed and mobile web index
        run: |
          DATE="\${{ steps.day.outputs.date }}"
          python scripts/publish_multilang_site.py \
            --date "$DATE" \
            --episode-dir "output/languages/$DATE" \
            --media-dir "build/languages/$DATE" \
            --docs-dir docs

      - name: Persist feed and episode history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/episodes.json docs/feed.xml
          git diff --cached --quiet || git commit -m "publish: Journey Talk \${{ steps.day.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy mobile site
        id: deployment
        uses: actions/deploy-pages@v4
