name: Journey Talk Multilang Daily

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-multilang.yml"
      - "cloud_languages.yaml"
      - "scripts/build_language_episodes.py"
      - "scripts/render_language_episodes.py"
      - "requirements.txt"
  schedule:
    - cron: "10 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the six MP3s to a GitHub Release"
        required: true
        type: boolean
        default: true

concurrency:
  group: journey-talk-multilang-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
      VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      FEATHERLESS_MODEL: ${{ vars.FEATHERLESS_MODEL }}
      ABLITERATION_API_KEY: ${{ secrets.ABLITERATION_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --requirement requirements.txt

      - name: Static verification
        run: |
          python -m py_compile scripts/build_language_episodes.py scripts/render_language_episodes.py
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("cloud_languages.yaml", encoding="utf-8"))
          assert len(cfg["languages"]) == 6
          assert cfg["episode"]["target_seconds"] == 600
          assert cfg["episode"]["stories_per_language"] == 3
          assert len({x["code"] for x in cfg["languages"]}) == 6
          print("cloud contract: PASS")
          PY

      - name: Resolve date and provider
        id: prep
        shell: bash
        run: |
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          PROVIDER=""
          if [[ -n "$VENICE_API_KEY" ]]; then
            PROVIDER="venice"
          elif [[ -n "$FEATHERLESS_API_KEY" ]]; then
            PROVIDER="featherless"
          elif [[ -n "$ABLITERATION_API_KEY" ]]; then
            PROVIDER="abliteration"
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          if [[ -z "$PROVIDER" ]]; then
            echo "No cloud LLM key is configured. Add VENICE_API_KEY (recommended) or a fallback provider key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Provider: $PROVIDER" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build six independent bilingual episodes
        if: steps.prep.outputs.provider != ''
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          python scripts/build_language_episodes.py --date "$DATE"

      - name: Render six ten-minute MP3s
        if: steps.prep.outputs.provider != ''
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          python scripts/render_language_episodes.py             --episode-dir "output/languages/$DATE"             --output-dir "build/languages/$DATE"

      - name: Upload build artifact
        if: steps.prep.outputs.provider != ''
        uses: actions/upload-artifact@v6
        with:
          name: journey-talk-multilang-${{ steps.prep.outputs.date }}
          retention-days: 7
          path: |
            output/languages/${{ steps.prep.outputs.date }}/
            build/languages/${{ steps.prep.outputs.date }}/

      - name: Publish six MP3s to GitHub Release
        if: >-
          steps.prep.outputs.provider != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish == true))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          TAG="multilang-${DATE}"
          gh release view "$TAG" >/dev/null 2>&1 ||             gh release create "$TAG"               --title "Journey Talk Multilang — ${DATE}"               --notes "Six independent ~10 minute bilingual language-learning news episodes."
          gh release upload "$TAG" build/languages/"$DATE"/*.mp3 --clobber

      - name: Summary
        if: always()
        run: |
          echo "## Contract" >> "$GITHUB_STEP_SUMMARY"
          echo "- 6 independent language editions" >> "$GITHUB_STEP_SUMMARY"
          echo "- English, German, Spanish, Russian, Chinese, Korean" >> "$GITHUB_STEP_SUMMARY"
          echo "- 3 unique RSS stories assigned to each edition (18 unique article records total)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target language + Japanese explanation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audio normalized to approximately 10 minutes per edition" >> "$GITHUB_STEP_SUMMARY"
