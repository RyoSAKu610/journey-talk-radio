name: Journey Talk Production Daily

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-multilang.yml"
      - "voice_profiles.yaml"
      - "incoming/**"
      - "scripts/prepare_episode_bundle.py"
      - "scripts/voice_director.py"
      - "scripts/voice_healthcheck.py"
      - "scripts/render_language_episodes.py"
      - "scripts/qa_language_episodes.py"
      - "scripts/publish_multilang_site.py"
      - "docs/index.html"
      - "docs/manifest.webmanifest"
      - "docs/sw.js"
      - "requirements.txt"
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date in YYYY-MM-DD (blank = today in Japan)"
        required: false
        type: string

concurrency:
  group: journey-talk-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR }}
      PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-journey-whisper-base-v2

      - name: Install dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          pip install --requirement requirements.txt

      - name: Resolve Japan date
        id: day
        shell: bash
        run: |
          REQUESTED="${{ inputs.date }}"
          if [[ -n "$REQUESTED" ]]; then
            if [[ ! "$REQUESTED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date: $REQUESTED" >&2
              exit 2
            fi
            DATE="$REQUESTED"
          else
            DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Episode date: $DATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production source and code
        run: |
          DATE="${{ steps.day.outputs.date }}"
          test -f "incoming/${DATE}.json" || {
            echo "Missing incoming/${DATE}.json. Production waits for the repair/generation loop; nothing is published." >&2
            exit 3
          }
          python -m py_compile \
            scripts/voice_director.py \
            scripts/prepare_episode_bundle.py \
            scripts/voice_healthcheck.py \
            scripts/render_language_episodes.py \
            scripts/qa_language_episodes.py \
            scripts/publish_multilang_site.py
          python - <<'PY'
          from scripts.voice_director import VoiceDirector
          director = VoiceDirector('voice_profiles.yaml')
          voices = director.verify_voice_matrix()
          assert director.version >= 2
          assert len(voices) == 12
          assert director.config['program']['target_min_seconds'] == 600
          assert director.config['program']['target_max_seconds'] == 900
          print('voice director contract: PASS')
          PY

      - name: Validate and prepare five language scripts
        run: |
          DATE="${{ steps.day.outputs.date }}"
          python scripts/prepare_episode_bundle.py \
            --date "$DATE" \
            --input "incoming/${DATE}.json" \
            --output-dir output/languages

      - name: Check configured voices against Edge TTS
        run: python scripts/voice_healthcheck.py

      - name: Render and QA with self-healing retries
        shell: bash
        run: |
          set +e
          DATE="${{ steps.day.outputs.date }}"
          PASSED=0
          for ROUND in 1 2 3; do
            echo "## Audio quality round ${ROUND}" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "build/languages/$DATE" "build/qa/$DATE"
            mkdir -p "build/languages/$DATE" "build/qa/$DATE"

            python scripts/render_language_episodes.py \
              --episode-dir "output/languages/$DATE" \
              --output-dir "build/languages/$DATE"
            RENDER_RC=$?
            if [[ $RENDER_RC -ne 0 ]]; then
              echo "- render failed (rc=${RENDER_RC}); regenerating from the same verified script" >> "$GITHUB_STEP_SUMMARY"
              sleep $((ROUND * 3))
              continue
            fi

            python scripts/qa_language_episodes.py \
              --episode-dir "output/languages/$DATE" \
              --media-dir "build/languages/$DATE" \
              --output-dir "build/qa/$DATE"
            QA_RC=$?
            if [[ $QA_RC -eq 0 ]]; then
              PASSED=1
              echo "- PASS" >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            echo "- QA failed (rc=${QA_RC}); report retained and audio will be regenerated" >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "build/qa/$DATE/qa-report.json" ]]; then
              python - <<PY
          import json
          from pathlib import Path
          p = Path('build/qa/$DATE/qa-report.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cats = [f"{x.get('slug')}:{x.get('category')}" for x in data.get('issues', [])]
          print('repair targets:', ', '.join(cats[:30]))
          PY
            fi
            sleep $((ROUND * 3))
          done
          set -e

          if [[ $PASSED -ne 1 ]]; then
            echo "Audio did not reach the publish gate in this runner. Diagnostics are kept for the cross-run repair loop; no MP3 is published." >&2
            exit 20
          fi

      - name: Publish QA-passed date archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.day.outputs.date }}"
          TAG="multilang-${DATE}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Journey Talk — ${DATE}" \
            --notes "Five 10–15 minute language-learning editions. Voice Director v2; publication requires full acoustic + sampled ASR QA PASS."
          gh release upload "$TAG" build/languages/"$DATE"/*.mp3 --clobber
          gh release upload "$TAG" output/languages/"$DATE"/*.json output/languages/"$DATE"/*.md --clobber
          gh release upload "$TAG" build/qa/"$DATE"/*.json --clobber

      - name: Build aggregate and per-language feeds
        run: |
          DATE="${{ steps.day.outputs.date }}"
          python scripts/publish_multilang_site.py \
            --date "$DATE" \
            --episode-dir "output/languages/$DATE" \
            --media-dir "build/languages/$DATE" \
            --qa-report "build/qa/$DATE/qa-report.json" \
            --docs-dir docs

      - name: Persist feed, history and health state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/episodes.json docs/feed*.xml docs/health.json
          git diff --cached --quiet || git commit -m "publish: Journey Talk ${{ steps.day.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Production summary
        run: |
          DATE="${{ steps.day.outputs.date }}"
          echo "## Journey Talk production PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Date: $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Five language editions: de / es / ru / zh / ko" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration gate: 10–15 minutes, no time stretching" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice Director: v2 language-specific profiles" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audio QA: decode, silence, volume/peak, speech-plan integrity, sampled Whisper" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local transient repair: up to 3 full render/QA rounds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cross-run repair: Journey Talk Build & Repair continues hourly until PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: multilang-$DATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist machine-readable repair state on failure
        if: failure()
        shell: bash
        run: |
          DATE="${{ steps.day.outputs.date }}"
          mkdir -p "build/repair/$DATE"
          python - <<PY
          import json, os
          from pathlib import Path
          date = "$DATE"
          qa_path = Path(f"build/qa/{date}/qa-report.json")
          qa = None
          if qa_path.is_file():
              try:
                  qa = json.loads(qa_path.read_text(encoding='utf-8'))
              except Exception:
                  qa = None
          state = {
              "date": date,
              "status": "NEEDS_REPAIR",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "commit": os.environ.get("GITHUB_SHA"),
              "qa": qa,
              "policy": "Do not publish or notify failure-only; preserve evidence and continue repair on the next loop.",
          }
          Path(f"build/repair/{date}/repair-state.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding='utf-8'
          )
          PY

      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journey-talk-repair-${{ steps.day.outputs.date }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            incoming/${{ steps.day.outputs.date }}.json
            output/languages/${{ steps.day.outputs.date }}/
            build/languages/${{ steps.day.outputs.date }}/media-manifest.json
            build/qa/${{ steps.day.outputs.date }}/
            build/repair/${{ steps.day.outputs.date }}/

  deploy-pages:
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload mobile site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy mobile site
        id: deployment
        uses: actions/deploy-pages@v4
